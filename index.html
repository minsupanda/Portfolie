urn;\n// 구르기 진입 제한\nif (MyCharacter->isDodge) return;\n// 점프 입력 제한","evidence":[["구르기 진입 조건","https://github.com/choiguri/GNU_PBL/blob/main/Source/GNU_PBL/Private/Characters/GnuMyCharacter.cpp#L416-L427"],["점프 입력 조건","https://github.com/choiguri/GNU_PBL/blob/main/Source/GNU_PBL/Private/Characters/GnuMyPlayerController.cpp#L662-L671"]],"status":"코드 확인"},{"id":"dodge-network","category":"멀티플레이","eyebrow":"ACTION REPLICATION","title":"구르기 몽타주 멀티캐스트 경로","lead":"서버가 구르기 입력을 검증한 후 다른 플레이어의 화면에서도 액션을 표현하도록 멀티캐스트 함수를 연결했습니다.","detail":"ServerMontageOnDodge()에서 애니메이션, 스태미나·쿨다운, 이동 처리 후 MultiCastMontage_Dodge()를 호출합니다. 멀티캐스트에서도 몽타주와 이동 처리가 이루어지므로, 서버와 클라이언트에서 중복 실행이 발생하는지는 별도로 확인해야 합니다.","flow":[["클라이언트 요청","Dodge 방향값 전달"],["ServerMontageOnDodge","서버 조건 검사·행동 실행"],["Multicast","다른 인스턴스에 구르기 전파"],["Montage + Launch","원격 시점의 동작 표현"],["검증 과제","권한·중복 실행 경로 점검"]],"snippet":"PlayAnimMontage(DodgeMontage);\nLaunchCharacter(AddVector, true, true);\nMultiCastMontage_Dodge(Forward, Right);","evidence":[["구르기 RPC 코드","https://github.com/choiguri/GNU_PBL/blob/main/Source/GNU_PBL/Private/Characters/GnuMyCharacter.cpp#L416-L480"]],"status":"코드 확인 · 추가 검증"}]}]};</script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=url=>{try{const a=new URL(String(url||''),location.href);return ['http:','https:','mailto:'].includes(a.protocol)?a.href:'#'}catch{return '#'}};
let projects=(window.PORTFOLIO_DATA?.projects||[]).slice(), active=0, mode='built', recordIndex=0, modalFocus=null;
const accent=p=>p.id==='battleline'?'#e7a787':'#99a8ff';
const poster=p=>`https://img.youtube.com/vi/${encodeURIComponent(p.video)}/maxresdefault.jpg`;
function useTheme(theme){document.documentElement.dataset.theme=theme;$('#theme').textContent=theme==='dark'?'☀':'☾';try{localStorage.setItem('minsu-portfolio-theme',theme)}catch{}}
let storedTheme='dark';try{storedTheme=localStorage.getItem('minsu-portfolio-theme')||'dark'}catch{}useTheme(storedTheme);
$('#theme').addEventListener('click',()=>useTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
function records(){let p=projects[active];return p.features.filter(f=>mode==='issues'?Boolean(f.issue):!f.issue)}
function renderHero(){let p=projects[active];if(!p)return;$('.hero').style.setProperty('--project-color',accent(p));const img=$('#heroCover');img.style.display='';img.dataset.tried='0';img.src=poster(p);$('#heroName').textContent=p.name;$('#heroSubtitle').textContent=p.short+' · '+p.engine;$('#heroCounter').textContent=`${String(active+1).padStart(2,'0')} / ${String(projects.length).padStart(2,'0')}`;$('#heroGenre').textContent=p.genre||p.short;$('#toRepo').href=safeUrl(p.repo);$('#heroProjects').innerHTML=projects.map((q,i)=>`<button type="button" data-project="${i}" class="${i===active?'active':''}" aria-pressed="${i===active}">${escapeHtml(q.name)}</button>`).join('');$('#heroProjects').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>selectProject(Number(b.dataset.project))))}
$('#heroCover').addEventListener('load',e=>{let img=e.target;if(img.naturalWidth<640&&img.dataset.tried!=='1'){img.dataset.tried='1';img.src=img.src.replace('maxresdefault','hqdefault')}});
$('#heroCover').addEventListener('error',e=>{let img=e.target;if(img.dataset.tried!=='1'){img.dataset.tried='1';img.src=img.src.replace('maxresdefault','hqdefault')}else img.style.display='none'});
function renderProject(){const p=projects[active];$('.project-area').style.setProperty('--project-color',accent(p));$('#detailName').textContent=p.name;$('#detailSummary').textContent=p.summary;$('#detailRole').textContent=p.myRole;$('#detailMeta').innerHTML=[p.engine,p.network,p.period].filter(Boolean).map(x=>`<span>${escapeHtml(x)}</span>`).join('<span aria-hidden="true">·</span>');renderTab();renderRecord()}
function renderTab(){$('#tabBuilt').setAttribute('aria-selected',String(mode==='built'));$('#tabIssues').setAttribute('aria-selected',String(mode==='issues'))}
function externalLinks(items){return (items||[]).filter(x=>Array.isArray(x)&&x[1]).map(([text,url])=>`<a href="${escapeHtml(safeUrl(url))}" target="_blank" rel="noopener noreferrer">${escapeHtml(text)} ↗</a>`).join('')}
function flowRows(flow){if(!Array.isArray(flow)||!flow.length)return '';return `<ol class="flow-list">${flow.map(step=>{let title=Array.isArray(step)?step[0]:step, desc=Array.isArray(step)?step[1]:'';return `<li><div><b>${escapeHtml(title)}</b>${desc?`<span>${escapeHtml(desc)}</span>`:''}</div></li>`}).join('')}</ol>`}
function issueRows(issue){if(!issue)return '';return [['현상',issue.problem],['원인 분석',issue.analysis],['수정',issue.action],['결과',issue.result]].filter(([,value])=>value).map(([key,value])=>`<div class="issue-line"><strong>${escapeHtml(key)}</strong><span>${escapeHtml(value)}</span></div>`).join('')}
function renderRecord(){const all=records();if(!all.length){$('#recordArticle').innerHTML='<p>등록된 기록이 없습니다.</p>';$('#recordNumber').textContent='';$('#nextTitle').textContent='';return}recordIndex=(recordIndex+all.length)%all.length;const f=all[recordIndex],next=all[(recordIndex+1)%all.length];$('#recordNumber').textContent=`${String(recordIndex+1).padStart(2,'0')} / ${String(all.length).padStart(2,'0')}`;$('#recordArticle').innerHTML=`<h4 class="record-name">${escapeHtml(f.title)}</h4><p class="record-lead">${escapeHtml(f.lead)}</p><div class="record-disclosures"><details><summary>${f.issue?'문제 분석과 해결 과정':'구현 과정 자세히 보기'}</summary><div class="record-detail"><p>${escapeHtml(f.detail)}</p>${f.issue?issueRows(f.issue):''}${flowRows(f.flow)}${String(f.status||'').includes('추가 검증')?'<div class="uncertain">현재 자료만으로는 모든 원격 클라이언트에서 해결 여부를 확정할 수 없습니다.</div>':''}</div></details>${f.snippet?`<details><summary>C++ 코드 보기</summary><div class="record-detail"><pre><code>${escapeHtml(f.snippet)}</code></pre></div></details>`:''}</div><div class="reference-links">${externalLinks(f.evidence)}</div>`;$('#nextTitle').textContent=`다음 · ${next.title}`}
function selectProject(i){if(!projects.length)return;active=(i+projects.length)%projects.length;mode='built';recordIndex=0;$('#viewer').classList.add('changing');renderHero();renderProject();setTimeout(()=>$('#viewer').classList.remove('changing'),240)}
function selectMode(newMode){mode=newMode;recordIndex=0;renderTab();renderRecord()}
function changeRecord(n){recordIndex+=n;renderRecord()}
$('#heroPrev').addEventListener('click',()=>selectProject(active-1));$('#heroNext').addEventListener('click',()=>selectProject(active+1));$('#projectPrev').addEventListener('click',()=>selectProject(active-1));$('#projectNext').addEventListener('click',()=>selectProject(active+1));$('#recordPrev').addEventListener('click',()=>changeRecord(-1));$('#recordNext').addEventListener('click',()=>changeRecord(1));$('#tabBuilt').addEventListener('click',()=>selectMode('built'));$('#tabIssues').addEventListener('click',()=>selectMode('issues'));
$('#toBuild').addEventListener('click',()=>selectMode('built'));$('#toIssues').addEventListener('click',()=>selectMode('issues'));
function bindSwipe(id,action){let start=null;const el=$(id);el.addEventListener('pointerdown',e=>{if(e.target.closest('button,a,summary,pre,code,input'))return;start={x:e.clientX,y:e.clientY}});el.addEventListener('pointerup',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;if(Math.abs(dx)>52&&Math.abs(dx)>Math.abs(dy)*1.25){action(dx<0?1:-1)}});el.addEventListener('pointercancel',()=>{start=null})}
bindSwipe('#viewer',step=>selectProject(active+step));bindSwipe('#projectSwipeZone',step=>selectProject(active+step));bindSwipe('#recordView',changeRecord);
$('#viewer').addEventListener('keydown',e=>{if(e.target.closest('button'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();selectProject(active+(e.key==='ArrowRight'?1:-1))}});
$('#recordView').addEventListener('keydown',e=>{if(e.target.closest('button,summary,pre,code'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();changeRecord(e.key==='ArrowRight'?1:-1)}});
function openVideo(){let p=projects[active];if(!/^[A-Za-z0-9_-]{11}$/.test(String(p.video||'')))return;modalFocus=document.activeElement;$('#videoFrame').src=`https://www.youtube-nocookie.com/embed/${p.video}?autoplay=1&rel=0`;$('#videoModal').classList.add('open');$('#videoClose').focus();document.body.style.overflow='hidden'}
function closeVideo(){$('#videoFrame').src='';$('#videoModal').classList.remove('open');document.body.style.overflow='';modalFocus?.focus?.()}
$('#watch').addEventListener('click',openVideo);$('#videoClose').addEventListener('click',closeVideo);$('#videoModal').addEventListener('click',e=>{if(e.target===$('#videoModal'))closeVideo()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#videoModal').classList.contains('open'))closeVideo()});
async function initializeData(){const cfg=window.PORTFOLIO_CONFIG||{};if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)return;const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';sc.onload=async()=>{try{const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false}});const {data,error}=await db.from('portfolio_public').select('payload').eq('id',1).maybeSingle();if(!error&&data?.payload?.projects?.length){projects=data.payload.projects.slice();active=0;selectProject(0)}try{if(!sessionStorage.getItem('portfolio_counted')){await db.from('page_views').insert({path:'/',referrer_host:document.referrer?new URL(document.referrer).hostname.slice(0,120):null});sessionStorage.setItem('portfolio_counted','1')}}catch{}}catch(err){console.warn('Using bundled portfolio content')}};document.head.appendChild(sc)}
if(projects.length){renderHero();renderProject();initializeData()}
})();
</script>
