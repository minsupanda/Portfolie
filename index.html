urn;\n// 구르기 진입 제한\nif (MyCharacter->isDodge) return;\n// 점프 입력 제한","evidence":[["구르기 진입 조건","https://github.com/choiguri/GNU_PBL/blob/main/Source/GNU_PBL/Private/Characters/GnuMyCharacter.cpp#L416-L427"],["점프 입력 조건","https://github.com/choiguri/GNU_PBL/blob/main/Source/GNU_PBL/Private/Characters/GnuMyPlayerController.cpp#L662-L671"]],"status":"코드 확인"},{"id":"dodge-network","category":"멀티플레이","eyebrow":"ACTION REPLICATION","title":"구르기 몽타주 멀티캐스트 경로","lead":"서버가 구르기 입력을 검증한 후 다른 플레이어의 화면에서도 액션을 표현하도록 멀티캐스트 함수를 연결했습니다.","detail":"ServerMontageOnDodge()에서 애니메이션, 스태미나·쿨다운, 이동 처리 후 MultiCastMontage_Dodge()를 호출합니다. 멀티캐스트에서도 몽타주와 이동 처리가 이루어지므로, 서버와 클라이언트에서 중복 실행이 발생하는지는 별도로 확인해야 합니다.","flow":[["클라이언트 요청","Dodge 방향값 전달"],["ServerMontageOnDodge","서버 조건 검사·행동 실행"],["Multicast","다른 인스턴스에 구르기 전파"],["Montage + Launch","원격 시점의 동작 표현"],["검증 과제","권한·중복 실행 경로 점검"]],"snippet":"PlayAnimMontage(DodgeMontage);\nLaunchCharacter(AddVector, true, true);\nMultiCastMontage_Dodge(Forward, Right);","evidence":[["구르기 RPC 코드","https://github.com/choiguri/GNU_PBL/blob/main/Source/GNU_PBL/Private/Characters/GnuMyCharacter.cpp#L416-L480"]],"status":"코드 확인 · 추가 검증"}]}]};</script>
<script>
(()=>{'use strict';
const $=(q,r=document)=>r.querySelector(q);
const esc=(x)=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=(url)=>{try{const p=new URL(String(url||''),location.href);return ['http:','https:','mailto:'].includes(p.protocol)?esc(p.href):'#'}catch{return '#'}};
const site=window.PORTFOLIO_DATA;
let projects=site.projects.slice(),active=0,pointer=null,modalPreviouslyFocused=null;
const projectId=p=>'p-'+String(p.id).replace(/[^a-z0-9_-]/gi,'');
const videoPoster=p=>`https://img.youtube.com/vi/${encodeURIComponent(p.video)}/maxresdefault.jpg`;
const projectColor=p=>p.id==='battleline'?'#dba180':'#9eaaff';
function setTheme(t){document.documentElement.dataset.theme=t;$('#themeToggle').textContent=t==='dark'?'☀':'☾';try{localStorage.setItem('portfolio-theme',t)}catch{}}
let theme='dark';try{theme=localStorage.getItem('portfolio-theme')||'dark'}catch{}setTheme(theme);
$('#themeToggle').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
const external=(url,label)=>`<a href="${safeUrl(url)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`;
function renderHero(){let p=projects[active];const frame=$('#cinema');frame.style.setProperty('--project-accent',projectColor(p));$('.hero').style.setProperty('--project-accent',projectColor(p));$('#heroPoster').style.display='';$('#heroPoster').dataset.retried='';$('#heroPoster').src=videoPoster(p);$('#heroTitle').textContent=p.name;$('#heroCategory').textContent=p.short;$('#heroDescription').textContent=p.summary;$('#viewWork').href='#'+projectId(p);$('#heroBuild').href='#'+projectId(p)+'-built';$('#heroIssues').href='#'+projectId(p)+'-issues';$('#heroRepo').href=safeUrl(p.repo);$('#projectSwitch').innerHTML=projects.map((q,i)=>`<button type="button" class="${i===active?'active':''}" aria-pressed="${i===active}" data-project="${i}">${esc(q.name)}</button>`).join('');$('#projectSwitch').querySelectorAll('[data-project]').forEach(b=>b.addEventListener('click',()=>selectProject(+b.dataset.project)))}
$('#heroPoster').addEventListener('load',e=>{let img=e.target;if(img.naturalWidth<640&&!img.dataset.retried){img.dataset.retried='1';img.src=img.src.replace('maxresdefault','hqdefault')}});
$('#heroPoster').addEventListener('error',e=>{let img=e.target;if(!img.dataset.retried){img.dataset.retried='1';img.src=img.src.replace('maxresdefault','hqdefault')}else img.style.display='none'});
function selectProject(index){active=(index+projects.length)%projects.length;const frame=$('#cinema');frame.classList.add('change');renderHero();renderProjects();setTimeout(()=>frame.classList.remove('change'),220)}
$('#heroPrev').addEventListener('click',()=>selectProject(active-1));$('#heroNext').addEventListener('click',()=>selectProject(active+1));
const hero=$('#cinema');hero.addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;pointer={x:e.clientX,y:e.clientY};});hero.addEventListener('pointerup',e=>{if(!pointer)return;let dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer=null;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)selectProject(active+(dx<0?1:-1))});hero.addEventListener('pointercancel',()=>{pointer=null});
function openVideo(){let p=projects[active];if(!/^[A-Za-z0-9_-]{11}$/.test(String(p.video||'')))return;modalPreviouslyFocused=document.activeElement;$('#videoFrame').src='https://www.youtube-nocookie.com/embed/'+p.video+'?autoplay=1&rel=0';$('#videoModal').classList.add('open');$('#closeVideo').focus();document.body.style.overflow='hidden'}
function closeVideo(){$('#videoModal').classList.remove('open');$('#videoFrame').src='';document.body.style.overflow='';modalPreviouslyFocused?.focus?.()}
$('#playVideo').addEventListener('click',openVideo);$('#closeVideo').addEventListener('click',closeVideo);$('#videoModal').addEventListener('click',e=>{if(e.target===$('#videoModal'))closeVideo()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#videoModal').classList.contains('open'))closeVideo();if(e.target.closest('input,textarea,[contenteditable]'))return;if(!$('#videoModal').classList.contains('open')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&window.scrollY<window.innerHeight){selectProject(active+(e.key==='ArrowRight'?1:-1))}});
function renderFlow(flow){if(!Array.isArray(flow)||!flow.length)return '';return `<ol class="progression">${flow.map(step=>`<li>${esc(Array.isArray(step)?step[0]:step)}</li>`).join('')}</ol><p class="flow-detail">${esc(flow.map(step=>Array.isArray(step)?step[1]:'' ).filter(Boolean).join(' · '))}</p>`}
function renderIssues(issue){if(!issue)return '';return `<dl>${[['현상',issue.problem],['확인',issue.analysis],['수정',issue.action],['결과',issue.result]].filter(pair=>pair[1]).map(([label,val])=>`<div class="issue-story"><dt>${esc(label)}</dt><dd>${esc(val)}</dd></div>`).join('')}</dl>`}
function renderItem(f,i){const issue=Boolean(f.issue);const uncertainty=String(f.status||'').includes('추가 검증');return `<details class="work-item" id="item-${esc(f.id)}"><summary aria-label="${esc(f.title)} 상세 보기"><span class="work-index">${String(i+1).padStart(2,'0')}</span><div><h4 class="work-name">${esc(f.title)}</h4></div><span class="work-caret" aria-hidden="true">+</span></summary><div class="work-body"><p class="opening-line">${esc(f.lead)}</p><p>${esc(f.detail)}</p>${issue?`<div class="content-separator"></div>${renderIssues(f.issue)}`:''}${uncertainty?'<div class="issue-uncertain">현재 소스와 개발 기록만으로는 모든 원격 클라이언트에서 해결됐는지 확인할 수 없습니다.</div>':''}${f.flow?.length?`<div class="content-separator"></div>${renderFlow(f.flow)}`:''}${f.snippet?`<details class="code-disclosure"><summary>관련 C++ 코드 일부 보기 ↗</summary><pre><code>${esc(f.snippet)}</code></pre></details>`:''}<div class="sourcebar">${(f.evidence||[]).filter(x=>Array.isArray(x)&&x[1]).map(x=>external(x[1],x[0])).join('')}</div></div></details>`}
function renderProjects(){const order=projects.slice(active).concat(projects.slice(0,active));$('#projects').innerHTML=order.map((p,pos)=>{const impl=p.features.filter(f=>!f.issue),issues=p.features.filter(f=>f.issue),pid=projectId(p);return `<section class="project ${p.id==='battleline'?'battle':''}" id="${pid}" aria-label="${esc(p.name)} 상세"><div class="shell"><div class="section-intro"><div><h2 class="project-heading">${esc(p.name)}<span class="underline"></span></h2></div><div><p class="role"><strong style="font-weight:630;color:var(--text)">담당</strong> · ${esc(p.myRole)}</p><p class="project-meta"><span>${esc(p.period)}</span><span>${esc(p.engine)}</span><span>${esc(p.network)}</span></p><div class="inline-links">${external(p.repo,'GitHub 저장소')}${external('https://www.youtube.com/watch?v='+p.video,'시연 영상')}</div></div></div><div class="chapter" id="${pid}-built"><div class="chapter-header"><h3>구현한 부분</h3></div><div class="work-list">${impl.map(renderItem).join('')}</div></div>${issues.length?`<div class="chapter" id="${pid}-issues" style="margin-top:105px"><div class="chapter-header"><h3>문제와 수정 과정</h3></div><div class="work-list">${issues.map(renderItem).join('')}</div></div>`:''}</div></section>${pos===0?`<div class="shell between-projects"><span>다음 프로젝트</span><a href="#${projectId(order[1])}">${esc(order[1].name)} ↗</a></div>`:''}`}).join('')}
$('#navWorks').addEventListener('click',e=>{e.preventDefault();document.getElementById(projectId(projects[active])).scrollIntoView({behavior:'smooth'})});
function init(){renderHero();renderProjects();const cfg=window.PORTFOLIO_CONFIG||{};if(cfg.supabaseUrl&&cfg.supabaseAnonKey){const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';script.onload=async()=>{try{const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false}});const {data,error}=await db.from('portfolio_public').select('payload').eq('id',1).maybeSingle();if(!error&&data?.payload?.projects?.length){projects=data.payload.projects;active=0;renderHero();renderProjects()}try{if(!sessionStorage.getItem('portfolio_counted')){await db.from('page_views').insert({path:'/',referrer_host:document.referrer?new URL(document.referrer).hostname.slice(0,120):null});sessionStorage.setItem('portfolio_counted','1')}}catch{}}catch(e){console.warn('Using bundled portfolio data')}};document.head.appendChild(script)}}init();
})();
</script>
</body></html>
