function renderAll(){const root=$('#detailsRoot');root.innerHTML=projects.map((p,i)=>{
const id=cssSafe(p.id);let color=i===0?'blue':'orange';const role=escapeHTML(p.myRole);
return `<section class="project-detail" id="project-${id}" data-project="${id}" data-color="${color}" aria-labelledby="title-${id}"><div class="shell"><div class="project-topline"><div class="project-order">프로젝트 ${String(i+1).padStart(2,'0')}</div><div class="project-time">${escapeHTML(p.period)}</div></div><div class="project-intro"><div><h2 id="title-${id}">${escapeHTML(p.name)}</h2><p class="project-sub">${escapeHTML(p.short)} · ${escapeHTML(p.network)}</p><p class="project-summary">${escapeHTML(p.summary)}</p></div><div><div class="project-role"><h3>직접 맡은 구현</h3><p>${role}</p></div><div class="project-facts"><span>${escapeHTML(p.engine)}</span><span>${escapeHTML(p.team)}</span></div>${p.achievement?`<p class="project-achieve">${escapeHTML(p.achievement)}</p>`:''}</div></div><div class="technical" id="tech-${id}"><div class="technical-head"><h3>구현과 문제 해결</h3><p>항목을 선택하면 실제 코드와 구현 과정을 볼 수 있습니다.</p></div><nav class="category-tabs" id="categories-${id}" aria-label="${escapeHTML(p.name)} 기술 분류"></nav><div class="records-grid"><nav class="record-index" id="recordList-${id}" aria-label="${escapeHTML(p.name)} 기술 사례"></nav><select class="record-select" id="recordSelect-${id}" aria-label="기술 사례 선택"></select><article class="record-article" id="article-${id}" aria-live="polite"></article></div></div></div></section>`;
}).join('');
for(const p of projects){states[p.id]??={category:'전체',index:0,flow:0,code:false};const select=$('#recordSelect-'+p.id);select.addEventListener('change',e=>{states[p.id].index=+e.target.value;states[p.id].flow=0;states[p.id].code=false;renderTech(p.id)});renderTech(p.id);}updateHero(heroIndex);
}
function featureIndices(p,category){return p.features.map((f,index)=>({f,index})).filter(item=>category==='전체'||item.f.category===category)}
function showCase(pid,fullIndex,category='전체',openCode=false){const p=findProject(pid);if(!p)return;const s=states[pid];if(category!=='전체'&&!(p.categories||[]).includes(category))category='전체';s.category=category;const choices=featureIndices(p,category);s.index=Math.max(0,choices.findIndex(x=>x.index===fullIndex));s.flow=0;s.code=openCode;renderTech(pid)}
function renderTech(pid){const p=findProject(pid),s=states[pid];if(!p)return;const id=cssSafe(pid);const tabs=$('#categories-'+id);tabs.innerHTML=['전체',...p.categories].map(c=>`<button type="button" class="${s.category===c?'active':''}" aria-current="${s.category===c?'true':'false'}" data-cat="${escapeHTML(c)}">${escapeHTML(c)}</button>`).join('');tabs.querySelectorAll('[data-cat]').forEach(btn=>btn.addEventListener('click',()=>{s.category=btn.dataset.cat;s.index=0;s.flow=0;s.code=false;renderTech(pid)}));
const items=featureIndices(p,s.category);s.index=Math.max(0,Math.min(s.index,items.length-1));const list=$('#recordList-'+id);list.innerHTML=items.map(({f},i)=>`<button type="button" class="${i===s.index?'active':''}" data-index="${i}" aria-current="${i===s.index?'true':'false'}"><span class="rec-num">${String(i+1).padStart(2,'0')}</span>${escapeHTML(f.title)}</button>`).join('');list.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{s.index=+b.dataset.index;s.flow=0;s.code=false;renderTech(pid)}));const choose=$('#recordSelect-'+id);choose.innerHTML=items.map(({f},i)=>`<option value="${i}" ${i===s.index?'selected':''}>${String(i+1).padStart(2,'0')} · ${escapeHTML(f.title)}</option>`).join('');
const f=items[s.index]?.f;if(!f){$('#article-'+id).innerHTML='<p>표시할 항목이 없습니다.</p>';return;}
const issue=f.issue?'<div class="article-section"><h5>문제와 해결 과정</h5><dl class="issue-steps">'+[['현상',f.issue.problem],['원인 분석',f.issue.analysis],['수정',f.issue.action],['결과',f.issue.result]].filter(([,b])=>b).map(([title,text])=>`<div class="issue-step"><dt>${escapeHTML(title)}</dt><dd>${escapeHTML(text)}</dd></div>`).join('')+'</dl></div>':'';
const detail=!f.issue&&f.detail?`<p class="record-detail">${escapeHTML(f.detail)}</p>`:'';
const flow=Array.isArray(f.flow)&&f.flow.length?`<div class="article-section"><h5>구현 흐름</h5><div class="flow-items">${f.flow.map(([title],i)=>`${i?'<span class="flow-separator" aria-hidden="true">→</span>':''}<button type="button" data-flow="${i}" class="${s.flow===i?'active':''}" aria-pressed="${s.flow===i}">${escapeHTML(title)}</button>`).join('')}</div><p class="flow-detail" id="flowText-${id}"><strong>${escapeHTML(f.flow[s.flow]?.[0]||'')}</strong> — ${escapeHTML(f.flow[s.flow]?.[1]||'')}</p></div>`:'';
const code=f.snippet?`<details class="code-expand" id="source-${id}" ${s.code?'open':''}><summary>C++ 코드 조각 보기</summary><div class="code-top"><span>C++ / Unreal Engine</span><button type="button" class="copy-code" id="copyCode-${id}">코드 복사</button></div><pre class="source-code"><code>${escapeHTML(f.snippet)}</code></pre></details>`:'';
const evidence=(f.evidence||[]).filter(e=>e&&e[1]).map(([name,url])=>`<a href="${safeURL(url)}" rel="noopener noreferrer" target="_blank">${escapeHTML(name)} ↗</a>`).join('');
const note=String(f.status||'').includes('추가 검증')?'<p class="verify-note">※ 구현 코드와 분석 기록은 확인했으며, 최종 멀티클라이언트 동작은 추가 검증이 필요합니다.</p>':'';
$('#article-'+id).innerHTML=`<div class="record-article-head"><span class="record-category">${escapeHTML(f.category)}</span><div class="record-arrows"><button type="button" data-prev aria-label="이전 사례" ${s.index===0?'disabled':''}>‹</button><button type="button" data-next aria-label="다음 사례" ${s.index===items.length-1?'disabled':''}>›</button></div></div><h4>${escapeHTML(f.title)}</h4><p class="record-lead">${escapeHTML(f.lead)}</p>${detail}${issue}${flow}${code}${evidence?`<div class="article-section"><h5>관련 코드와 기록</h5><div class="links">${evidence}</div></div>`:''}${note}<div class="record-footer"><span>${s.index+1} / ${items.length}</span><button class="copy-link" type="button" data-copy-url>이 기록 링크 복사 ↗</button></div>`;
const article=$('#article-'+id);article.querySelector('[data-prev]')?.addEventListener('click',()=>{s.index--;s.flow=0;s.code=false;renderTech(pid)});article.querySelector('[data-next]')?.addEventListener('click',()=>{s.index++;s.flow=0;s.code=false;renderTech(pid)});
article.querySelectorAll('[data-flow]').forEach(b=>b.addEventListener('click',()=>{s.flow=+b.dataset.flow;article.querySelectorAll('[data-flow]').forEach(x=>{const yes=+x.dataset.flow===s.flow;x.classList.toggle('active',yes);x.setAttribute('aria-pressed',String(yes))});const pair=f.flow[s.flow];$('#flowText-'+id).innerHTML=`<strong>${escapeHTML(pair[0])}</strong> — ${escapeHTML(pair[1])}`;}));
article.querySelector('#copyCode-'+id)?.addEventListener('click',async e=>{try{await navigator.clipboard.writeText(f.snippet);e.target.textContent='복사됨'}catch{e.target.textContent='복사 불가'}});
article.querySelector('[data-copy-url]')?.addEventListener('click',async e=>{const url=location.origin+location.pathname+'#case='+encodeURIComponent(pid)+'.'+items[s.index].index;try{await navigator.clipboard.writeText(url);e.target.textContent='링크 복사됨'}catch{e.target.textContent='복사 불가'}});
}
window.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;if(e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,textarea,select,[contenteditable]'))return;const hero=$('#heroCarousel').getBoundingClientRect();if(hero.bottom>100&&hero.top<window.innerHeight-80){e.preventDefault();updateHero(heroIndex+(e.key==='ArrowRight'?1:-1));return;}const sections=projects.filter(p=>{const box=$('#tech-'+p.id).getBoundingClientRect();return box.top<window.innerHeight&&box.bottom>100});if(sections.length){const s=states[sections[0].id],count=featureIndices(sections[0],s.category).length;s.index=Math.max(0,Math.min(count-1,s.index+(e.key==='ArrowRight'?1:-1)));s.flow=0;s.code=false;renderTech(sections[0].id);}});
function deepLink(){try{const match=location.hash.match(/^#case=([^.]*)\.(\d+)$/);if(!match)return;const pid=decodeURIComponent(match[1]),ix=Number(match[2]);const p=findProject(pid);if(p&&ix>=0&&ix<p.features.length){showCase(pid,ix,'전체',false);scrollTo($('#tech-'+pid));}}catch{}}
renderAll();deepLink();
const cfg=window.PORTFOLIO_CONFIG||{};if(cfg.supabaseUrl&&cfg.supabaseAnonKey){const src=document.createElement('script');src.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';src.async=true;src.onload=async()=>{try{const db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false}});const {data:published,error}=await db.from('portfolio_public').select('payload').eq('id',1).maybeSingle();if(!error&&published?.payload?.projects?.length){projects=published.payload.projects;renderAll();deepLink()}try{if(!sessionStorage.getItem('minsu-counted')){await db.from('page_views').insert({path:'/',referrer_host:document.referrer?new URL(document.referrer).hostname.slice(0,120):null});sessionStorage.setItem('minsu-counted','1')}}catch{}}catch(e){console.warn('Published content unavailable; using bundled portfolio.')}};document.head.appendChild(src)}
})();</script></body></html>
